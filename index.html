<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Balise indispensable pour le rendu sur mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon coeur</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #101827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden; /* Empêche les barres de défilement dues aux cœurs */
            position: relative;
        }

        h1 {
            color: #00c8ff;
            font-size: clamp(28px, 6vw, 45px);
            margin-bottom: 15px;
            z-index: 2; /* Pour que le texte reste bien au-dessus des cœurs */
        }

        p {
            font-size: clamp(16px, 4vw, 20px);
            margin-bottom: 20px;
            z-index: 2;
        }

        /* Cadre du compteur de jours */
        .compteur-box {
            background-color: #1f293d;
            border: 2px solid #00c8ff;
            border-radius: 12px;
            padding: 15px 25px;
            margin-bottom: 30px;
            font-size: clamp(16px, 4vw, 20px);
            color: #00c8ff;
            line-height: 1.5;
            max-width: 400px;
            width: 100%;
            z-index: 2;
        }

        .compteur-box span {
            font-weight: bold;
            font-size: clamp(18px, 4.5vw, 22px);
        }

        /* Style des boutons */
        .boutons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
            z-index: 2;
        }

        button {
            background-color: #00c8ff;
            color: #101827;
            font-weight: bold;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        button:hover {
            background-color: white;
        }

        /* Style des cœurs animés */
        .heart {
            position: absolute;
            bottom: -20px;
            color: #ff69b4;
            font-size: 20px;
            user-select: none;
            z-index: 1;
            animation: floatUp 4s linear infinite;
            opacity: 0.7;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-105vh) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <h1>Bienvenue mon cœur !</h1>

    <p>Ceci t'est destiné</p>

    <!-- Affichage du compteur -->
    <div class="compteur-box" id="compteur">
        Chargement du compteur...
    </div>

    <div class="boutons">
        <button onclick="window.location.href='page2.html'">
            Je t'aime
        </button>
        <button onclick="window.location.href='page3.html'">
            Écris-moi quelque chose ❤️
        </button>
    </div>

    <script>
        // Date de votre rencontre : 19 mars 2026 (Mars = 2 en JS)
        var dateRencontre = new Date(2026, 2, 19); 
        var aujourdhui = new Date();

        // 1. Nombre total de jours
        var diffTemps = aujourdhui - dateRencontre;
        var diffJoursTotal = Math.floor(diffTemps / (1000 * 60 * 60 * 24));

        // 2. Calcul en années, mois et jours
        var annees = aujourdhui.getFullYear() - dateRencontre.getFullYear();
        var mois = aujourdhui.getMonth() - dateRencontre.getMonth();
        var jours = aujourdhui.getDate() - dateRencontre.getDate();

        if (jours < 0) {
            mois--;
            var moisPrecedent = new Date(aujourdhui.getFullYear(), aujourdhui.getMonth(), 0);
            jours += moisPrecedent.getDate();
        }

        if (mois < 0) {
            annees--;
            mois += 12;
        }

        // Formatage du texte selon la durée
        var texteDetail = "";
        if (annees > 0) {
            texteDetail += annees + (annees > 1 ? " ans " : " an ");
        }
        if (mois > 0 || annees > 0) {
            texteDetail += mois + " mois ";
        }
        texteDetail += jours + (jours > 1 ? " jours" : " jour");

        // Affichage final
        document.getElementById("compteur").innerHTML = 
            "<span>Ensemble depuis :</span><br>" + 
            texteDetail + " ❤️<br>" + 
            "<span style='font-size: 0.85em; opacity: 0.85;'>(soit " + diffJoursTotal + " jours en tout)</span>";

        // Fonction pour créer des cœurs qui montent en arrière-plan
        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = "❤️";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 3 + 3) + "s"; // Vitesse aléatoire entre 3 et 6s
            heart.style.fontSize = (Math.random() * 15 + 15) + "px"; // Taille aléatoire
            document.body.appendChild(heart);

            // Supprime le cœur une fois qu'il est sorti de l'écran pour ne pas ralentir le téléphone
            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        // Génère un nouveau cœur toutes les 400 millisecondes
        setInterval(createHeart, 400);
    </script>

</body>
</html>
