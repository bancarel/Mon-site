<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nos petits mots</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #101827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        h1 {
            color: #00c8ff;
            font-size: clamp(24px, 5vw, 35px);
            margin-bottom: 20px;
        }

        /* La boîte qui affiche le message magique */
        .boite-mot {
            background-color: #1f293d;
            border: 2px solid #00c8ff;
            border-radius: 15px;
            padding: 25px;
            max-width: 450px;
            width: 100%;
            margin-bottom: 30px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(16px, 4vw, 20px);
            color: #ff69b4;
            line-height: 1.5;
            box-shadow: 0 4px 15px rgba(0, 200, 255, 0.1);
        }

        .boutons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }

        button {
            background-color: #00c8ff;
            color: #101827;
            font-weight: bold;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        button:hover {
            background-color: white;
        }

        .btn-retour {
            background-color: transparent;
            color: white;
            border: 1px solid white;
        }

        .btn-retour:hover {
            background-color: white;
            color: #101827;
        }
    </style>
</head>
<body>
